[project]
name = "alias-suggest"
version = "0.1.0"
description = "Shell alias suggestion tool powered by Claude"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.18.0",
    "click>=8.0.0",
]

[project.scripts]
alias-suggest = "alias_suggest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alias_suggest"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

